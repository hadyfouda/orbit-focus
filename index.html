<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Orbit — لعبة استكشاف فضاء هادية بتشتغل مع وقت تركيزك: الرحلة وقت الشغل، والهبوط على الكوكب هو البريك.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orbit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Orbit — رحلة التركيز</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="logo"></span><div><b>ORBIT</b><small>رحلة التركيز</small></div></div>
      <div id="res" class="res-row" aria-label="الموارد"></div>
    </header>
    <main id="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="التنقل"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="color:#fff;text-align:center;padding:40px">Orbit محتاج JavaScript يشتغل.</p></noscript>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
